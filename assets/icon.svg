<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Installment Management">
  <defs>
    <linearGradient id="tile" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="0.45" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#115E59"/>
    </linearGradient>
    <radialGradient id="glow" cx="280" cy="180" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="620" y1="580" x2="930" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.55" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="spine" x1="176" y1="0" x2="248" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B5F59"/>
    </linearGradient>
    <filter id="pageShadow" x="-25%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#03211F" flood-opacity="0.38"/>
    </filter>
    <filter id="softBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <clipPath id="pageClip">
      <rect x="176" y="168" width="576" height="672" rx="60"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#glow)"/>

  <g filter="url(#pageShadow)">
    <rect x="176" y="168" width="576" height="672" rx="60" fill="#F8FAFC"/>
  </g>

  <rect x="176" y="168" width="74" height="672" fill="url(#spine)" clip-path="url(#pageClip)"/>

  <g>
    <g>
      <circle cx="338" cy="322" r="42" fill="#0D9488"/>
      <path d="M317 323l15 16 29 -34" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="410" y="304" width="252" height="36" rx="18" fill="#CBD5E1"/>
    </g>
    <g>
      <circle cx="338" cy="452" r="42" fill="#0D9488"/>
      <path d="M317 453l15 16 29 -34" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="410" y="434" width="186" height="36" rx="18" fill="#CBD5E1"/>
    </g>
    <g>
      <circle cx="338" cy="582" r="42" fill="none" stroke="#94A3B8" stroke-width="13"/>
      <rect x="410" y="564" width="214" height="36" rx="18" fill="#E2E8F0"/>
    </g>
  </g>

  <circle cx="772" cy="770" r="180" fill="#03211F" opacity="0.30" filter="url(#softBlur)"/>
  <g>
    <circle cx="772" cy="748" r="180" fill="url(#coin)"/>
    <circle cx="772" cy="748" r="132" fill="none" stroke="#FFFBEB" stroke-width="16" stroke-opacity="0.92"/>
    <ellipse cx="722" cy="676" rx="74" ry="42" fill="#FFFFFF" opacity="0.16" transform="rotate(-32 722 676)"/>
    <text x="772" y="807" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="150" font-weight="700" fill="#92400E" letter-spacing="-4">Rs</text>
  </g>
</svg>
